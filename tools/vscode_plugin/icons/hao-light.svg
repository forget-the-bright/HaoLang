      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="16" cy="16" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

