<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="skin" x1="6" y1="4" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="1"/>
      <stop offset="40%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="78%" stop-color="#FDE68A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FDBA74" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="skinDeep" x1="8" y1="10" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="shine" x1="10" y1="5" x2="20" y2="18" gradientUnits="userSpaceOnUse">
