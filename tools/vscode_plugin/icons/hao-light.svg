  <path d="M24.3 8.2l.35 1.05 1.05.35-1.05.35-.35 1.05-.35-1.05-1.05-.35 1.05-.35z" fill="#A78BFA" opacity="0.85"/>
  <path d="M25.8 15.1l.25.75.75.25-.75.25-.25.75-.25-.75-.75-.25.75-.25z" fill="#F472B6" opacity="0.7"/>
  <circle cx="10.2" cy="20.8" r="0.55" fill="#FDE68A" opacity="0.55"/>
