  <circle cx="13.15" cy="9.55" r="0.55" fill="#312E81" opacity="0.9"/>
  <circle cx="15.55" cy="9.4" r="0.55" fill="#312E81" opacity="0.9"/>
  <circle cx="13.35" cy="9.4" r="0.18" fill="#FFFFFF" opacity="0.95"/>
